# ShopSync nginx vhost. This file is a template: the startup script rewrites
# __PORT__ with Render's dynamically assigned $PORT before nginx starts.
#
# Document root is Laravel's public/ only — application source, vendor/,
# storage/ and .env are physically outside the document root and cannot be
# served. PHP requests are passed to the php-fpm Unix socket.

server {
    listen __PORT__;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25M;

    access_log /dev/stdout;
    error_log /dev/stderr notice;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Laravel front controller: everything that is not a real file goes
    # through public/index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Hashed Vite assets and uploaded files are immutable enough to cache.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Defence in depth: never serve dotfiles (.env, .git, ...) even if the
    # document root changes.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
}
