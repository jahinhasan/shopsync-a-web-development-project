; ShopSync PHP production settings.
; Dropped into /usr/local/etc/php/conf.d/ by the Dockerfile, so it loads
; after the image defaults.

memory_limit = 256M
max_execution_time = 60

; Product images and shop-application documents are uploaded through forms.
upload_max_filesize = 20M
post_max_size = 25M

; Don't advertise the PHP version.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; OPcache. Code is baked into an immutable image, so revalidation is off.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
