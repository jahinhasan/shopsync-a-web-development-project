; ShopSync php-fpm pool overrides, applied on top of the image's default
; www.conf pool (this zz- file loads last and wins).
;
; clear_env = no is the important line: php-fpm normally scrubs the
; environment for workers, which would hide Render's environment variables
; (DB_PASSWORD, APP_KEY, ...) from Laravel entirely.

[www]
clear_env = no

; Unix socket shared with nginx (same container).
listen = /tmp/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Conservative pool sizing for Render's small instances; each Laravel
; request peaks around 50-80 MB.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Surface PHP worker output (fatals, warnings) in container logs.
catch_workers_output = yes
decorate_workers_output = no
